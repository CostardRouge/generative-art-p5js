# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20).
# Trimmed to what this repository has: one package.json at the root and
# the workflows; no Dockerfile, no compose file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # The tools that ARE the gate (linter, formatter, type checker) get a
      # pull request of their own: their minors add rules and reformat files
      # with nothing that ships touched (Biome 2.6 turned four repos red on
      # 2026-11-01), so they never hold the month's runtime updates back.
      tooling:
        patterns: ['@biomejs/*']
        update-types: [minor, patch]
      # Every other minor and patch, production and development together:
      # one pull request a month.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # chrome-aws-lambda 10.1.0, the last ever published, peers on
      # puppeteer-core ^10: any later major fails `npm ci` with ERESOLVE.
      # Lift when the Mac-only preview script leaves chrome-aws-lambda
      # (the owner's call, docs/memory/gallery-and-deploy.md).
      - dependency-name: 'puppeteer-core'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
