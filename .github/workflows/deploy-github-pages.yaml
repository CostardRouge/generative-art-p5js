name: Build and Deploy to github-pages
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install and Build 🔧
        run: |
          npm install
          npm install --prefix ./node_modules/sketch-gallery
          npm run gallery:build
      # Audience measurement (scripts/inject-umami.js): the tracker tag goes
      # into every built page. The website id is in the script; set
      # UMAMI_WEBSITE_ID here to override it, empty to switch it off.
      - name: Count visits with Umami 📈
        run: npm run umami:inject
      # The version at the foot of the gallery's page (scripts/inject-version.js),
      # read from package.json: rule 4 of CLAUDE.md.
      - name: Show the version 🏷️
        run: npm run version:inject
      - name: Deploy to GitHub pages🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: node_modules/sketch-gallery/dist
