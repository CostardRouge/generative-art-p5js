name: CI

# The gate (CLAUDE.md, Context): the lint and the tests, then what the deploy builds — the
# gallery page, the sources copied beside it, the site's own files (site/),
# the tracker, the icons and the version written into the built pages, the
# llms.txt written beside them — on every pull request and every push to main.
# Nothing is deployed here. The previews (scripts/build-previews.js) are not
# part of it: they need the owner's Mac and its Chrome. Every run checks out
# the whole repository, 1.5 GB of sketches and their media.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    # Named rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Node's own runner over tests/: the scripts that write the built site,
      # the icon set, the legal notice against the tracker, tree.json's paths.
      - name: Test
        run: npm test

      # The gallery package ships no lockfile, hence its own install after npm ci.
      - name: Build the gallery
        run: |
          npm install --prefix ./node_modules/sketch-gallery
          npm run gallery:build

      # site/ (the icon set, the manifest) to the built root, then the
      # tracker, the icons and the version written into the built pages.
      - name: Add the site's own files and write into the built pages
        run: |
          npm run site:copy
          npm run umami:inject
          npm run icons:inject
          npm run version:inject
          npm run llms:build
          grep -q 'data-version="' node_modules/sketch-gallery/dist/index.html
          grep -q 'rel="apple-touch-icon"' node_modules/sketch-gallery/dist/index.html
          test -f node_modules/sketch-gallery/dist/manifest.webmanifest
          test -s node_modules/sketch-gallery/dist/llms.txt
